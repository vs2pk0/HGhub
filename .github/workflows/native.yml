name: Native mobile

# 原生安卓 / iOS。推到 main 且动到 native 时自动打包，安卓用仓库密钥签名，iOS 保持未签名，然后发到 Releases。
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"

      - name: 编译并签名 APK
        working-directory: native/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          HGHUB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HGHUB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HGHUB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${HGHUB_KEY_ALIAS:-}" ]; then
            echo "::error::缺少 Android 签名密钥（ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS）"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KS"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          export HGHUB_KEYSTORE="$KS"
          ZIP="$RUNNER_TEMP/gradle.zip"
          urls=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-8.11.1-bin.zip"
            "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          )
          ok=0
          for url in "${urls[@]}"; do
            echo "下载 Gradle: $url"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 180 -o "$ZIP" "$url" && \
                echo "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  $ZIP" | sha256sum --check --status; then
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          rm -rf "$RUNNER_TEMP/gradle-8.11.1"
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          n=0
          until "$RUNNER_TEMP/gradle-8.11.1/bin/gradle" :app:assembleRelease --no-daemon; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              exit 1
            fi
            echo "编译失败，20 秒后重试 ($n/3)"
            sleep 20
          done
          rm -f "$KS"

      - name: 校验签名并收集产物
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ver="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' native/android/app/build.gradle.kts)"
          f="$(find native/android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$f"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs "$f"
          cp "$f" "artifacts/HGhub_${ver}_android.apk"
          ls -lh artifacts

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: artifacts/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: 编译未签名 App
        working-directory: native/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project HGhub.xcodeproj \
            -scheme HGhub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 IPA
        working-directory: native/ios
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release-iphoneos/HGhub.app"
          test -d "$APP"
          ver="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' "$GITHUB_WORKSPACE/native/android/app/build.gradle.kts")"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP" build/Payload/HGhub.app
          (cd build && zip -qry "HGhub_${ver}_ios-unsigned.ipa" Payload)
          codesign -dv build/Payload/HGhub.app || true
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "build/HGhub_${ver}_ios-unsigned.ipa" "$GITHUB_WORKSPACE/artifacts/"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - uses: actions/upload-artifact@v6
        with:
          name: ios
          path: artifacts/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' native/android/app/build.gradle.kts)"
          tag="mobile-v${ver}"
          ls -lh dist
          notes="原生移动端 ${ver}，包名 app.hghub.mobile。Android 已签名，可直接安装。iOS 是未签名 IPA，需要自行签名后安装。"
          gh release view "$tag" >/dev/null 2>&1 && exists=1 || exists=0
          if [ "$exists" -eq 1 ]; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "HGhub 移动端 ${ver}" \
              --notes "$notes" \
              --latest
          fi
          gh release view "$tag" --json url,tagName,assets --jq '{url,tag:.tagName,assets:[.assets[].name]}'
